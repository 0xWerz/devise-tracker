name: scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: collect and ingest
        env:
          WORKER_URL: https://devise.werz.xyz
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: npx --yes tsx scripts/collect.ts
